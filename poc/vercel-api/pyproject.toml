[project]
name = "dataomatix-api-poc"
version = "0.1.0"
description = "Dataomatix API proof of concept on Vercel (Increment 7.2)"
requires-python = ">=3.12,<3.13"
# The application's own code (backend/app) with only what these routes
# import — versions pinned to backend/requirements.txt.
dependencies = [
    "fastapi==0.141.1",
    "SQLAlchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "alembic==1.19.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "cryptography==50.0.0",
    "bcrypt==5.0.0",
    "httpx==0.28.1",
    "pymupdf==1.28.0",
    "lxml==6.1.1",
    "python-dateutil==2.9.0.post0",
    "orjson==3.11.9",
    "zstandard==0.25.0",
    "python-multipart==0.0.32",
    "Pygments==2.20.0",
    "vercel==0.12.1",
]

[tool.vercel]
entrypoint = "poc_api:app"

[[tool.vercel.subscribers]]
entrypoint = "poc_queue"
